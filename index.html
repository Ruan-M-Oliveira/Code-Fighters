<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CODE FIGHTERS</title>
  <link rel="stylesheet" href="css/style.css?v=12" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #ui-overlay .interactive {
      pointer-events: all;
    }

    /* Loading Screen */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen .logo {
      font-size: clamp(1.6rem, 6vw, 3rem);
      text-align: center;
      font-weight: bold;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #00e5ff;
      text-shadow: 0 0 20px #00e5ff, 0 0 40px #0077ff;
      margin-bottom: 0.5rem;
      animation: pulse-logo 2s ease-in-out infinite;
    }

    #loading-screen .subtitle {
      font-size: 1rem;
      letter-spacing: 0.5em;
      color: #667;
      margin-bottom: 3rem;
      text-transform: uppercase;
    }

    #loading-screen .bar-wrapper {
      width: 320px;
      height: 4px;
      background: #111;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0077ff, #00e5ff);
      box-shadow: 0 0 8px #00e5ff;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #loading-text {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: #446;
      text-transform: uppercase;
    }

    @keyframes pulse-logo {
      0%, 100% { text-shadow: 0 0 20px #00e5ff, 0 0 40px #0077ff; }
      50%       { text-shadow: 0 0 40px #00e5ff, 0 0 80px #0077ff, 0 0 120px #0055cc; }
    }
  </style>
</head>
<body>

  <!-- Main render surface -->
  <canvas id="gameCanvas"></canvas>

  <!-- HTML UI overlay (menus, HUD, dialogs) -->
  <div id="ui-overlay"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="logo">CODE FIGHTERS</div>
    <div class="subtitle">Combate espacial</div>
    <div class="bar-wrapper">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">Iniciando sistemas...</div>
  </div>

  <!-- Game modules — order matters -->
  <script src="js/utils.js?v=12"></script>
  <script src="js/audio.js?v=12"></script>
  <script src="js/particles.js?v=12"></script>
  <script src="js/projectile.js?v=12"></script>
  <script src="js/powerup.js?v=12"></script>
  <script src="js/asteroid.js?v=12"></script>
  <script src="js/enemy.js?v=12"></script>
  <script src="js/boss.js?v=12"></script>
  <script src="js/ships.js?v=12"></script>
  <script src="js/player.js?v=12"></script>
  <script src="js/wave.js?v=12"></script>
  <script src="js/collision.js?v=12"></script>
  <script src="js/leaderboard.js?v=12"></script>
  <script src="js/ui.js?v=12"></script>
  <script src="js/debug.js?v=12"></script>
  <script src="js/attract.js?v=12"></script>
  <script src="js/gamepad.js?v=12"></script>
  <script src="js/game.js?v=12"></script>

</body>
</html>
